{{- if .Values.enableChart }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mission-control.fullname" . }}-service
  labels:
    {{- include "mission-control.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mission-control.selectorLabels" . | nindent 4 }}
{{- end }}
