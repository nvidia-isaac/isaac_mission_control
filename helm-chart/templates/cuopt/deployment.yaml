{{- if .Values.enableChart }}
{{- if .Values.cuopt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mission-control.fullname" . }}-cuopt
  labels:
    {{- include "mission-control.cuopt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cuopt.replicaCount }}
  selector:
    matchLabels:
      {{- include "mission-control.cuopt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mission-control.cuopt.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ include "mission-control.fullname" . }}-cuopt
        image: "{{ .Values.cuopt.image.repository }}:{{ .Values.cuopt.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.cuopt.image.pullPolicy }}
        resources:
          limits:
            cpu: {{ .Values.resources.cuopt.limits.cpu }}
            memory: {{ .Values.resources.cuopt.limits.memory }}
            nvidia.com/gpu: {{ .Values.resources.cuopt.limits.gpu }}
          requests:
            cpu: {{ .Values.resources.cuopt.requests.cpu }}
            memory: {{ .Values.resources.cuopt.requests.memory }}
            nvidia.com/gpu: {{ .Values.resources.cuopt.requests.gpu }}
        env:
          - name: CUOPT_SERVER_LOG_LEVEL
            value: "{{ .Values.cuopt.logLevel }}"
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
{{- end }}
{{- end }}