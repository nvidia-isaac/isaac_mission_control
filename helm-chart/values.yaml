# Default values for mission-control.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# If set to false, it will set replicas for all components to 0
enableChart: true
replicaCount: 1

image:
  repository: nvcr.io/nvidia/isaac/mission-control
  pullPolicy: IfNotPresent
  tag: 5.0.0
verbosity: INFO

imagePullSecrets:
  - name: "inference-container-pull-secret"
  - name: "docker-hub-secret"
  - name: "ngc-docker-reg-secret"
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  missionControl:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "2"
      memory: 2Gi
  cuopt:
    limits:
      cpu: "1"
      memory: 2Gi
      gpu: "1"
    requests:
      cpu: "1"
      memory: 2Gi
      gpu: "1"
  waypointGraphGenerator:
    limits:
      cpu: "2"
      memory: 4Gi
      gpu: "1"
    requests:
      cpu: "2"
      memory: 4Gi
      gpu: "1"

startupProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 240
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

env:
  robots:
    # -- All keys are required
    - name: "carter01"
      labels: ["test", "carter", "ros"]
      heartbeat_timeout: 30
      battery:
        critical_level: 10
        recommended_minimum: 0
        recommended_maximum: 100
  map:
    file: ""
    uri: ""
    s3: ""
    id: "default"
    metadataYaml: ""
    resolution: 0.05 # required for occupancy map
    occupancyThreshold: 129 # required for occupancy map
    x_offset: 0
    y_offset: 0
    rotation: 0.0
    safety_distance: 0.45
    pushMapOnStartup: false
    saveRouteVisualization: false
    docks:
      - dockId: dock01
        dockType: nova_carter_dock
        dockPose:
          xCoordinate: 43.7278
          yCoordinate: 19.7377 # refraim from using y as key since it will be coerced to "true" 
          yaw: 1.36224
  constants:
    minBattery: 0.0
    startupTimeout: 1200
  telemetry:
    enabled: false
    id: ""
    secret: ""
    # -- {DEV | TEST | PROD}
    env: "TEST"
  s3:
    accessKey: ""
    secretKey: ""
    region: ""
    endpointUrl: ""
cuopt:
  # -- If enabled, spawn a cuopt deployment&service for mission-control to connect to. If disabled, mission-control will connect to cuopt.externalServiceUrl instead
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/nvidia/cuopt
    pullPolicy: "IfNotPresent"
    tag: "25.8.0-cuda12.8-py3.12"
  logLevel: warning
  # -- http://cuopt-url:80
  externalServiceUrl: ""

environment:
  - name: example_name
    value: example_value

waypointGraphGenerator:
  # -- If enabled, spawn a waypointGraphGenerator deployment&service for mission-control to connect to. If disabled, mission-control will connect to waypointGraphGenerator.externalServiceUrl instead
  enabled: true 
  replicaCount: 1
  image:
      repository: nvcr.io/nvidia/isaac/swagger
      pullPolicy: "IfNotPresent"
      tag: "08252025"
  # -- http://waypoint-graph-generator-url:80
  externalServiceUrl: ""

# Settings for Mission Database component
missionDatabase:
  # -- http://mission-database-url:80
  externalServiceUrl: "" 

# Settings for Mission Dispatch component
missionDispatch:
  # -- http://mission-dispatch-url:80
  externalServiceUrl: "" 
  mission_timeout: 300
