version: 2
rules:
  - path: "*bringup_services.yaml"
    message: "*allow_anonymous*"
    reason: >-
      Reviewed and accepted. The stack this configures is not a real instance,
      and in its current wiring the broker is connected only to robots
      simulated in Isaac Sim, so anonymous access reaches no live fleet. This
      file is Mission Control's own docker-compose/bringup_services.yaml
      vendored byte for byte; the setting is the product's, and changing it
      here would fork the file this skill exists to edit.
fingerprints: []
