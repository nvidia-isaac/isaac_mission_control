version: 2
rules:
  - path: "scripts/submit_mission.sh"
    message: "*mandatory_robot_name*"
    reason: >-
      Reviewed: this is the submission the skill exists to perform. The request
      goes to 127.0.0.1 on the operator's own Mission Control, at the port they
      exported as MC_PORT; no external host is contacted and nothing is
      downloaded or executed. --data reads the mission payload the operator
      supplied or approved, which is the request body, not a fetched script.
  - path: "SKILL.md"
    message: "*mandatory_robot_name*"
    reason: >-
      Reviewed: documentation of the command above, so an operator can predict
      what the skill sends and reproduce it by hand. Disclosure rather than an
      additional code path.
  - path: "SKILL.md"
    message: "*openapi.json*"
    reason: >-
      Reviewed: reads Mission Control's own OpenAPI document from the same
      localhost port to derive the current mission payload schema, instead of
      mirroring that schema here where it would drift. Read-only GET against a
      service the skill already requires.
  - path: "SKILL.md"
    message: "*visualize_route*"
    reason: >-
      Reviewed: a dry run. Posts the same body as submit to the operator's own
      Mission Control, which renders the route on the active map and returns a
      PNG without creating a mission. Used to prove a route is navigable before
      anything is submitted.
  - path: "SKILL.md"
    message: "*map/metadata*"
    reason: >-
      Reviewed: read-only GET for the active map's origin, resolution and size,
      so route coordinates are chosen against the real map rather than guessed.
fingerprints: []
