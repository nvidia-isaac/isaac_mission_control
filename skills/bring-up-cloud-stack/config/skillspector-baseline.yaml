version: 2
rules:
  - id: "PE3"
    path: "scripts/up.sh"
    message: "*.[e]nv*"
    reason: >-
      Reviewed: sources the stack's own explicitly named docker-compose
      configuration file so compose receives the ports and credentials it
      needs. Fixed relative path, resolved workspace-first then from the
      skill's bundled resources; not credential-file discovery.
  - id: "PE3"
    path: "scripts/preflight.sh"
    message: "*.[e]nv*"
    reason: >-
      Reviewed: read-only readiness check. Resolves the same explicitly named
      file to report which tier it came from and whether the required compose
      variables are present. No credential value is printed or transmitted.
  - id: "PE3"
    path: "scripts/lib/compose-config.sh"
    message: "*.[e]nv*"
    reason: >-
      Reviewed: shared resolution helper for the two scripts above. Contains
      the path-resolution function and the required-variable list only; it
      opens no file itself.
  - id: "PE3"
    path: "SKILL.md"
    message: "*.[e]nv*"
    reason: >-
      Reviewed: documentation. The Configuration Resolution section names the
      files the skill reads so operators can predict what it touches, which is
      disclosure rather than credential access.
  - path: "*bringup_services.yaml"
    message: "*allow_anonymous*"
    reason: >-
      Reviewed and accepted. The stack this brings up is not a real instance,
      and in its current wiring the broker is connected only to robots
      simulated in Isaac Sim, so anonymous access reaches no live fleet.
fingerprints: []
