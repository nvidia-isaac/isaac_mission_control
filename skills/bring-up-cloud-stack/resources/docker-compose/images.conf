# Container image references for the Mission Control stack.
#
# Kept separate from the compose credentials file deliberately: that file
# holds the broker and database secrets, and change-stack-version rewrites
# this file on every image swap. Splitting them means that skill never
# reads or writes a file containing secrets.
#
# up.sh sources the credentials file first and then this one, so a value
# here wins over a stale duplicate left in an older credentials file.
#
# The 5.0.0 Isaac images are single multi-arch manifests covering linux/amd64
# and linux/arm64, so there is no 5.0.0-arm64 tag. The *_IMAGE_ARM64 variables
# are kept for compatibility and point at the same tag. swagger and cuopt are
# on their own release schemes and are not part of the 5.x line.

MISSION_DATABASE_IMAGE=nvcr.io/nvidia/isaac/mission-database:5.0.0
MISSION_DATABASE_IMAGE_ARM64=nvcr.io/nvidia/isaac/mission-database:5.0.0
MISSION_DISPATCH_IMAGE=nvcr.io/nvidia/isaac/mission-dispatch:5.0.0
MISSION_DISPATCH_IMAGE_ARM64=nvcr.io/nvidia/isaac/mission-dispatch:5.0.0
MOSQUITTO_IMAGE=eclipse-mosquitto:2.0.22
POSTGRES_IMAGE=postgres:14.5
WPG_IMAGE=nvcr.io/nvidia/isaac/swagger:03102026
WPG_IMAGE_ARM64=nvcr.io/nvidia/isaac/swagger:03102026-arm64
MISSION_CONTROL_IMAGE=nvcr.io/nvidia/isaac/mission-control:5.0.0
MISSION_CONTROL_IMAGE_ARM64=nvcr.io/nvidia/isaac/mission-control:5.0.0
MISSION_SIMULATOR_IMAGE=nvcr.io/nvidia/isaac/mission-simulator:5.0.0
MISSION_SIMULATOR_IMAGE_ARM64=nvcr.io/nvidia/isaac/mission-simulator:5.0.0
CUOPT_IMAGE=nvidia/cuopt:25.8.0-cuda12.8-py3.12
